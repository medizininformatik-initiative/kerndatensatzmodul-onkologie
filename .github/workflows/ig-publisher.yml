name: Build IG (HL7 IG Publisher)

# Baut den IG-Publisher-basierten Implementierungsleitfaden (SUSHI + IG Publisher).
# - Loest bei Push auf hl7-ig-build* sowie bei Pull Requests aus.
# - Bei Pull Requests wird output/ als Artifact hochgeladen.
# - Bei Push auf hl7-ig-build* wird zusaetzlich nach GitHub Pages (Branch-Unterverzeichnis) publiziert.
# - Terminologie-Proxy (NGINX + Client-Zertifikat) nach dem Vorbild der MII-Module
#   (z. B. kerndatensatzmodul-labor). Sind die Proxy-Secrets nicht gesetzt, faellt
#   der Build auf einen oeffentlichen Terminologieserver zurueck.
# Bestehende Modul-Workflows (main.yml, render-plantuml.yml) bleiben unberuehrt.

on:
  push:
    branches:
      - 'hl7-ig-build*'
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Determine terminology backend
        id: tx
        shell: bash
        env:
          CDS_DEV_CLIENT_CERT: ${{ secrets.CDS_DEV_CLIENT_CERT }}
        run: |
          if [ -n "${CDS_DEV_CLIENT_CERT}" ]; then
            echo "proxy=true" >> "$GITHUB_OUTPUT"
            echo "tx_url=http://127.0.0.1:8090/fhir" >> "$GITHUB_OUTPUT"
            echo "Terminologie: MII-Proxy (Client-Zertifikat vorhanden)."
          else
            echo "proxy=false" >> "$GITHUB_OUTPUT"
            echo "tx_url=https://tx.fhir.org" >> "$GITHUB_OUTPUT"
            echo "Terminologie: oeffentlicher Fallback (tx.fhir.org) — Proxy-Secrets fehlen."
          fi

      - name: Create NGINX config and certificates
        if: steps.tx.outputs.proxy == 'true'
        shell: bash
        env:
          CDS_DEV_CLIENT_CERT: ${{ secrets.CDS_DEV_CLIENT_CERT }}
          CDS_DEV_CLIENT_KEY: ${{ secrets.CDS_DEV_CLIENT_KEY }}
          CDS_DEV_CLIENT_CERT_PASSWORD: ${{ secrets.CDS_DEV_CLIENT_CERT_PASSWORD }}
        run: |
          mkdir -p nginx/certs
          curl -sSL -o nginx/nginx.conf https://raw.githubusercontent.com/medizininformatik-initiative/kerndatensatz-meta/refs/heads/master/.github/workflows/nginx.conf
          echo "$CDS_DEV_CLIENT_CERT" | base64 -d > nginx/certs/client-cert.pem
          echo "$CDS_DEV_CLIENT_KEY" | base64 -d > nginx/certs/client-key-encrypted.key
          openssl rsa -in nginx/certs/client-key-encrypted.key -out nginx/certs/client-key.key -passin env:CDS_DEV_CLIENT_CERT_PASSWORD

      - name: Start NGINX Proxy
        if: steps.tx.outputs.proxy == 'true'
        run: |
          docker run -d --name nginx-proxy \
            -v $PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v $PWD/nginx/certs:/etc/nginx/certs:ro \
            -p 8090:80 \
            nginx:alpine
          sleep 5
          for i in {1..10}; do
            if curl --head --silent --fail http://localhost:8090; then
              echo "NGINX is responding."
              break
            else
              echo "NGINX not responding. Attempt $i"
              sleep 2
              if [ $i -eq 10 ]; then
                echo "NGINX still not responding."
                docker logs nginx-proxy
                exit 1
              fi
            fi
          done

      # SUSHI (FSH -> FHIR), inkl. Snapshot-Unterstuetzung (MII-Image)
      - name: Run SUSHI
        run: docker run --rm --network host -v $PWD:/workspace -v /usr/bin/dot:/usr/local/bin/dot:ro -v /usr/lib/x86_64-linux-gnu:/usr/host/lib:ro -e LD_LIBRARY_PATH="/usr/host/lib:$LD_LIBRARY_PATH" -w /workspace ghcr.io/gefyra/ig-publisher-with-snapshot-support:latest sushi .

      # HL7 FHIR IG Publisher
      - name: Build IG
        env:
          TX_URL: ${{ steps.tx.outputs.tx_url }}
        run: |
          docker run --rm --network host -v $PWD:/workspace -v /usr/bin/dot:/usr/local/bin/dot:ro -v /usr/lib/x86_64-linux-gnu:/usr/host/lib:ro -e LD_LIBRARY_PATH="/usr/host/lib:$LD_LIBRARY_PATH" -w /workspace ghcr.io/gefyra/ig-publisher-with-snapshot-support:latest sh -c "igpublisher -ig ig.ini -tx ${TX_URL} || true"
          if [ -d "output" ] && [ "$(ls -A output)" ]; then
            echo "IG build produced output."
            exit 0
          else
            echo "IG build failed to produce output."
            exit 1
          fi

      - name: Cleanup NGINX
        if: always() && steps.tx.outputs.proxy == 'true'
        run: |
          docker stop nginx-proxy || true
          docker rm nginx-proxy || true

      - name: Fix output directory permissions
        if: always()
        run: sudo chown -R $USER:$USER output || true

      - name: Publish QA summary
        if: always()
        shell: bash
        run: |
          if [ -f output/qa.txt ]; then
            echo '### IG Publisher QA' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -n 20 output/qa.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # Bei Pull Requests: output/ als Artifact hochladen (kein Pages-Deploy)
      - name: Upload IG output (PR artifact)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fhir-ig-output
          path: output
          retention-days: 14

      # Publish the IG output to GitHub Pages
      - name: Publish to GitHub Pages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        shell: bash
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"

          rm -rf gh-pages

          if git ls-remote --heads "${remote_url}" gh-pages | grep -q "."; then
            git clone --depth 1 --branch gh-pages "${remote_url}" gh-pages
          else
            git clone "${remote_url}" gh-pages
            cd gh-pages
            git config user.name "${GIT_AUTHOR_NAME}"
            git config user.email "${GIT_AUTHOR_EMAIL}"
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            touch .nojekyll
            git add .nojekyll
            git commit -m "chore: initialize gh-pages"
            git push --set-upstream origin gh-pages
            cd ..
          fi

          # GitHub blocks files >100 MB; Onko's full-ig.zip is ~132 MB.
          # The full package remains available as workflow artifact.
          find output -type f -size +99M -print -delete

          # Publish main/master branch to root, other branches to subdirectories
          if [[ "${GITHUB_REF_NAME}" == "main" ]] || [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            # Main branch: publish to root
            cd gh-pages
            # Remove all files except branch subdirectories and .nojekyll
            find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.nojekyll' ! -path './[a-zA-Z0-9_-]*' -exec rm -rf {} + 2>/dev/null || true
            cd ..
            cp -R "output/." "gh-pages/"
            echo "Published ${GITHUB_REF_NAME} to root"
          else
            # Feature branches: publish to subdirectory
            branch_dir="gh-pages/${GITHUB_REF_NAME}"
            rm -rf "${branch_dir}"
            mkdir -p "${branch_dir}"
            cp -R "output/." "${branch_dir}/"
            echo "Published ${GITHUB_REF_NAME} to ${GITHUB_REF_NAME}/ subdirectory"
          fi

          cd gh-pages
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add --all
          if git diff --cached --quiet; then
            echo "No updates to publish."
            exit 0
          fi
          git commit -m "chore: update ${GITHUB_REF_NAME} pages"
          git push origin gh-pages

      - name: Announce published URL
        id: announce_url
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        shell: bash
        run: |
          set -eu
          repo_owner="${GITHUB_REPOSITORY_OWNER}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          branch="${GITHUB_REF_NAME}"
          
          # Main/master branch published to root, others to subdirectory
          if [[ "${branch}" == "main" ]] || [[ "${branch}" == "master" ]]; then
            url="https://${repo_owner}.github.io/${repo_name}/"
          else
            url="https://${repo_owner}.github.io/${repo_name}/${branch}/"
          fi
          
          echo "Published to ${url}"
          printf '### Deployment\n[Open published IG for branch `%s`](%s)\n' "${branch}" "${url}" >> "${GITHUB_STEP_SUMMARY}"
          echo "published_url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Upsert PR comment with published URL
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          PUBLISHED_URL: ${{ steps.announce_url.outputs.published_url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = process.env.BRANCH_NAME;
            const marker = '<!-- ig-publish-url -->';
            const url = process.env.PUBLISHED_URL;
            const body = `${marker}
            ### Deployment
            [Open published IG for branch \`${branch}\`](${url})`;

            // Try to find an open PR for this branch
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 100
            });
            const pr = prs.find(p => p.head && p.head.ref === branch);
            if (!pr) {
              core.info(`No open PR found for branch ${branch}; skipping PR comment.`);
              return;
            }

            // List existing comments on that PR
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number, per_page: 100
            });

            // Find existing marker comment (any author)
            const existing = comments.find(c => typeof c.body === 'string' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
              core.info(`Updated IG publish URL comment on PR #${pr.number}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body
              });
              core.info(`Created IG publish URL comment on PR #${pr.number}`);
            }

