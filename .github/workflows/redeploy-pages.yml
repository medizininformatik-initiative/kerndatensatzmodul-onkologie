# =============================================================================
# redeploy-pages.yml — deploy the CURRENT gh-pages tree to GitHub Pages
#                      without rebuilding anything.
#
# Purpose:  After a manual fix on the gh-pages branch (for example the
#           2026-09-15 size cleanup: the ballot.1 publish had COMMITTED its
#           site, but the Pages deploy failed on the 2.49 GB artifact limit
#           and the cleanup workflow only deploys when IT removed something),
#           this workflow re-publishes the tree as-is. No SUSHI, no Publisher.
#
# Triggers: workflow_dispatch ONLY.
# =============================================================================
name: Redeploy Pages from gh-pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages-writes
  cancel-in-progress: false

jobs:
  redeploy:
    name: Package and deploy current gh-pages tree
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Report tree size
        run: du -sh . && du -sh */ | sort -rh | head -8

      - name: Package as Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
